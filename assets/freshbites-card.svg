  <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#555550">Built with fast route transitions, lazy-loaded imagery, and optimized mobile checkout.</text>

